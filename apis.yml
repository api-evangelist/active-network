name: Active Network
description: >-
  ACTIVE Network provides intelligent activity and event management software for
  communities and organizations, powering registration, payments, marketing, and
  attendance for recreation departments, YMCAs, camps, schools, event organizers,
  and municipalities, and is trusted by over 6,300 organizations worldwide. For
  developers, ACTIVE Network publishes a set of read-only public data APIs on its
  AMP platform (api.amp.active.com): the Activity Search API v2 surfaces
  searchable activities and events from ACTIVE.com and ACTIVEkids.com, and the
  Campground / Campsite Search APIs surface campgrounds and campsites. All APIs
  are authenticated with a simple api_key query parameter and are rate limited.
